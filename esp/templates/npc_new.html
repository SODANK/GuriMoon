{{define "content"}}
<h2>Create NPC</h2>
<p style="font-size:12px;color:#9ca3af;margin:-4px 0 14px;max-width:900px">
  Work through the tabs, check <b>Review</b>, then press <b>Create NPC</b>. Set spawn locations afterwards on Region Spawns.
</p>

{{if .Result}}<div class="alert alert-{{if contains .Result "Error"}}error{{else}}success{{end}}">{{.Result}}</div>{{end}}

<form method="POST" action="/npcs/new">
  {{template "npcform" .}}
</form>

{{if .HasModels}}<script src="/static/npc_viewer.js"></script>{{end}}
{{end}}

{{template "layout" .}}
